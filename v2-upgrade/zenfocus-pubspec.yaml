name: zenfocus
description: An open-source, ad-free, offline-first focus timer built with Flutter.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.24.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  just_audio: ^0.9.40
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  go_router: ^12.2.2
  animated_text_kit: ^4.2.2
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/animations/
    - assets/icons/
    - assets/images/