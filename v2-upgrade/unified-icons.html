<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统一图标系统</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --bg: #ffffff;
            --surface: #f8fafc;
            --text: #1e293b;
            --text-secondary: #64748b;
            --radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .icon-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .icon-card:hover {
            transform: translateY(-5px);
        }

        .icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
        }

        .icon-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .icon-secondary {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: white;
        }

        .icon-success {
            background: var(--success);
            color: white;
        }

        .icon-warning {
            background: var(--warning);
            color: white;
        }

        .icon-error {
            background: var(--error);
            color: white;
        }

        .icon-info {
            background: var(--info);
            color: white;
        }

        .icon-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .icon-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .color-palette {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .color-item {
            width: 60px;
            height: 60px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        .animation-demo {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .animated-icon {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .bounce-icon {
            animation: bounce 1s infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-icon {
            animation: spin 2s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>统一品牌视觉系统</h1>
            <p>为所有应用提供一致的视觉体验</p>
        </div>

        <div class="color-palette">
            <div class="color-item" style="background: var(--primary);">Primary</div>
            <div class="color-item" style="background: var(--secondary);">Secondary</div>
            <div class="color-item" style="background: var(--accent);">Accent</div>
            <div class="color-item" style="background: var(--success);">Success</div>
            <div class="color-item" style="background: var(--warning);">Warning</div>
            <div class="color-item" style="background: var(--error);">Error</div>
            <div class="color-item" style="background: var(--info);">Info</div>
        </div>

        <div class="icon-grid">
            <div class="icon-card">
                <div class="icon icon-primary">🎯</div>
                <div class="icon-name">ZenFocus</div>
                <div class="icon-desc">专注计时器</div>
            </div>
            <div class="icon-card">
                <div class="icon icon-secondary">🤖</div>
                <div class="icon-name">Tiny-AI</div>
                <div class="icon-desc">AI对话助手</div>
            </div>
            <div class="icon-card">
                <div class="icon icon-accent">🎬</div>
                <div class="icon-name">Emoji Cinema</div>
                <div class="icon-desc">AI故事生成</div>
            </div>
            <div class="icon-card">
                <div class="icon icon-success">✍️</div>
                <div class="icon-name">AI Writing</div>
                <div class="icon-desc">写作助手</div>
            </div>
            <div class="icon-card">
                <div class="icon icon-warning">🎮</div>
                <div class="icon-name">Tiny-Game</div>
                <div class="icon-desc">游戏合集</div>
            </div>
            <div class="icon-card">
                <div class="icon icon-info">🚀</div>
                <div class="icon-name">品牌系统</div>
                <div class="icon-desc">统一视觉</div>
            </div>
        </div>

        <div class="animation-demo">
            <div class="animated-icon">🎯</div>
            <div class="animated-icon bounce-icon">🤖</div>
            <div class="animated-icon spin-icon">🎬</div>
        </div>
    </div>
</body>
</html>
